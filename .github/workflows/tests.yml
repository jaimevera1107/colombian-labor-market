name: tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/lock-py312.txt

      - name: Install (pinned versions)
        run: |
          python -m pip install -U pip setuptools wheel
          python -m pip install --no-deps ./dependencias/tempdisagg-0.6.3-py3-none-any.whl
          python -m pip install -r requirements/lock-py312.txt
          python -m pip install --no-deps -e .

      - name: Tests, with the RC1 references
        env:
          ICML_GOLDEN_DIR: ""  # RC1 references removed with legacy/; tests skip automatically
        run: python -m pytest -q

      - name: The monthly plan runs on the repository data
        run: python -m icml recalcular --root . --simulacro
