name: H20 portable delivery smoke

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  package-and-operations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install with target lock
        run: |
          python -m pip install -c requirements/lock-py312.txt -e ".[dev]"
      - name: Verify source and immutable delivery contract
        run: |
          python -m pytest -q tests/unit/test_h20_delivery.py tests/unit/test_vintage.py
          python -m compileall -q src/icml
          python -m icml operations --help
      # Full H20 integrated tests require separate versioned H11/H16 data and
      # 102 external RC1 golden artifacts; do not silently mark those as passed.
