name: H21 certification smoke (no RC1 artifacts)
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  h21-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install locked test environment
        run: python -m pip install -c requirements/lock-py312.txt -e ".[dev]"
      - name: Unit gate and package smoke (does not certify RC1)
        run: |
          python -m pytest -q tests/unit/test_h21_certification.py
          python -m icml operations certify --help
      # RC1 original golden files are external. Do not mark tests using them as passed.
