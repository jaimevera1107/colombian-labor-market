[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "icml"
version = "2.4.0"
description = "Reconstruction of subnational labor market indicators for Colombia (ICML 2.0)."
readme = "README.md"
requires-python = ">=3.11,<3.16"
authors = [{ name = "Jaime A. Vera-Jaramillo" }]
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "numpy>=2.0,<3",
    "pandas>=2.2,<3",
    "scipy>=1.13,<2",
    "scikit-learn>=1.6,<2",
    "xgboost>=2.0,<4",
    "statsmodels>=0.14,<0.16",
    "matplotlib>=3.8,<4",
    "openpyxl>=3.1,<4",
    "xlrd>=2.0.1,<3",
    "tempdisagg==0.6.3",
]

[project.optional-dependencies]
ml = ["torch>=2.3,<3"]
plots = ["matplotlib>=3.8,<4"]
dev = [
    "pytest>=8,<10",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.10",
]

[project.scripts]
icml = "icml.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"icml.domain" = ["data/*.csv"]

[tool.ruff]
line-length = 79
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "D", "ANN", "B", "UP", "SIM", "NPY", "PD"]
# PD010: ``pivot`` is preferred on purpose. It raises on duplicated keys,
# whereas ``pivot_table`` would silently aggregate them.
ignore = ["PD010"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "ANN"]

[tool.mypy]
# Strict typing of the package's own API. pandas-stubs is deliberately not
# used: its overloads reject idiomatic numerical pandas code (thousands of
# false positives on arithmetic between Series), which would push the code
# towards casts instead of clarity. Data frames are therefore typed as
# ``pandas.DataFrame`` at boundaries and checked at run time by contracts.
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "golden: requires the RC1 golden artifacts (set ICML_GOLDEN_DIR).",
]
