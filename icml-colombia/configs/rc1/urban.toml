# Urban stage configuration reproducing RC1.

[urban.sources]
historical_signals = "datos/2_procesamiento/fuentes_preparadas/urbano/senales_historicas_23_y_donantes.csv"
window_proxies = "datos/2_procesamiento/fuentes_preparadas/urbano/proxies_anuales_ventanas_2026_08.csv"
reference_donors = "datos/2_procesamiento/fuentes_preparadas/urbano/donantes_congelados_referencia.csv"
synthetic_donor = "datos/2_procesamiento/fuentes_preparadas/urbano/cundinamarca_25_donante_congelado.json"
frozen_selection = "datos/2_procesamiento/fuentes_preparadas/urbano/donantes_pareto_congelados_h30.json"

[urban.donors]
# Cities without GEIH history 2007-2020; they receive a donor trajectory.
recipient_codes = [81, 85, 86, 88, 91, 94, 95, 97, 99]
# Codes present in the historical file that are not GEIH cities.
excluded_codes = [25]
selection_years = [2021, 2022, 2023, 2024]
holdout_year = 2025
seam_year = 2021
history_start = 2007
history_end = 2020
proxy_last_year = 2026
published_unit_persons = 1000.0
guard_tolerance_log = 0.03
validation_quantile = 0.95
pareto_tolerance = 1e-12
# Tie-break weights over (growth_occ, growth_pop, rate, scale, ratio_stability).
tie_break_weights = [0.30, 0.20, 0.20, 0.10, 0.20]
minimax_weight = 0.10
# A priori score used to pick the pseudo-incumbent in the 23-city backtest.
incumbent_score_weights = [0.28, 0.16, 0.21, 0.12, 0.23]
normalization_low_quantile = 0.1
normalization_high_quantile = 0.9
normalization_min_scale = 1e-10

[urban.bridge]
start_year = 2015
end_year = 2020
target_mean_log = 0.080
max_terminal_log_change = 0.17
max_extra_log_growth = 0.03
tolerance = 1e-10

[urban.retropolation]
start_period = "1993-01"
anchor_start_year = 2007
end_period = "2020-12"
splice_overlap_months = 12
backtest_calibration_years = [2015, 2017, 2019]
anchor_tolerance = 1e-5

[urban.synthetic]
recipient_code = 25
donor_code = 11
recipient_name = "Cundinamarca — señal urbana sintética"
donor_name = "Bogotá D.C."
calibration_years = [2021, 2022, 2023, 2024]
first_year = 2007
last_year = 2024
max_official_anchor_adjustment_persons = 5.0
